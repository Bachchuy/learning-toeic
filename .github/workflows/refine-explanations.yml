name: Auto Refine TOEIC Explanations with Gemini

on:
  workflow_dispatch:
    inputs:
      part:
        description: "Phạm vi cần vá: all (Part 6/7 + Part 5 + Exam), 5, 6, 7, reading, hoặc exam"
        required: true
        default: "all"
      limit:
        description: "Tổng số câu muốn vá (chạy cuốn chiếu từng mẻ, ví dụ 150-250 để tận dụng hết quota ngày)"
        required: true
        default: "200"
      batch_size:
        description: "Số câu mỗi mẻ trước khi nghỉ cooldown (khuyến nghị 40-50)"
        required: true
        default: "40"
      cooldown:
        description: "Số giây nghỉ giải lao giữa các mẻ (khuyến nghị 25-30s)"
        required: true
        default: "30"
      require_example:
        description: "Có vá bổ sung các câu Part 5 đã refined nhưng còn thiếu example_en không (true/false)"
        required: false
        default: "false"
  # Tự động chạy mỗi ngày 1 lần lúc 00:30 UTC (07:30 giờ Việt Nam, sau mốc reset quota 07:00)
  schedule:
    - cron: "30 0 * * *"

# Khóa tuần tự tuyệt đối: không bao giờ chạy 2 job song song để tránh dồn request vào Gemini API
concurrency:
  group: refine-explanations-ai
  cancel-in-progress: false

jobs:
  refine-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Create .env.local from ENV_LOCAL secret if exists
        run: |
          if [ -n "${{ secrets.ENV_LOCAL }}" ]; then
            cat << 'EOF' > .env.local
          ${{ secrets.ENV_LOCAL }}
          EOF
            echo "Đã nạp file .env.local từ secret ENV_LOCAL thành công!"
          fi

      - name: Run AI Explanation Refiner
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          TARGET_PART: ${{ github.event.inputs.part || 'all' }}
          LIMIT: ${{ github.event.inputs.limit || '200' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '40' }}
          COOLDOWN_SECONDS: ${{ github.event.inputs.cooldown || '30' }}
          REQUIRE_EXAMPLE: ${{ github.event.inputs.require_example || 'false' }}
          REQUEST_DELAY_MS: "6500"
        run: npx tsx scripts/refine-explanations-ai.ts
