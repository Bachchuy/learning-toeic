name: Auto Refine TOEIC Explanations with Gemini

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Số lượng câu muốn vá trong lần chạy này"
        required: true
        default: "500"
  schedule:
    # Tự động kích hoạt mỗi 2 tiếng một lần để vá dần dần cho đến khi hết
    - cron: "0 */2 * * *"

jobs:
  refine-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run AI Explanation Refiner
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIMIT: ${{ github.event.inputs.limit || '500' }}
        run: npx tsx scripts/refine-explanations-ai.ts
